<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Event System V3 FIX ARCH</title>

<style>
:root{
  --bg:#0b0f14;
  --card:#111826;
  --accent:#7cf7c2;
  --text:#e8eef6;
  --muted:#9aa7b2;
  --line:rgba(255,255,255,0.08);
}

*{box-sizing:border-box;font-family:system-ui;margin:0;padding:0;}

body{
  background:var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
  padding:20px;
}

.wrap{width:100%;max-width:900px;}

.nav{
  display:flex;
  gap:10px;
  margin-bottom:12px;
}

.nav button{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#111826;
  color:var(--text);
  cursor:pointer;
}

.nav button.active{
  border-color:var(--accent);
  color:var(--accent);
}

.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
}

input,textarea{
  width:100%;
  padding:10px;
  margin-bottom:8px;
  border-radius:8px;
  border:1px solid var(--line);
  background:#0e141c;
  color:var(--text);
}

textarea{height:80px;resize:none;}

.btn{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  background:var(--accent);
  font-weight:600;
  cursor:pointer;
  color:#0b0f14;
}

.event{
  padding:10px;
  border:1px solid var(--line);
  margin-bottom:8px;
  border-radius:10px;
  cursor:pointer;
}

small{color:var(--muted);}

a{
  color:var(--accent);
  text-decoration:none;
  word-break:break-all;
}
hr{border:0;border-top:1px solid var(--line);margin:10px 0;}
</style>
</head>

<body>

<div class="wrap">

<!-- NAV -->
<div class="nav">
  <button id="tabCreate" class="active" onclick="show('create')">➕ Create</button>
  <button id="tabList" onclick="show('list')">📂 Events</button>
  <button id="tabView" onclick="show('view')">👁 View</button>
</div>

<!-- CREATE -->
<div id="create" class="panel">
  <h3>Tworzenie eventu</h3>

  <input id="title" placeholder="Nazwa eventu">
  <input id="date" placeholder="Data">
  <input id="place" placeholder="Lokalizacja">
  <textarea id="desc" placeholder="Opis"></textarea>

  <button class="btn" onclick="createEvent()">Utwórz event</button>
</div>

<!-- LIST -->
<div id="list" class="panel" style="display:none;">
  <h3>Twoje eventy</h3>
  <div id="events"></div>
</div>

<!-- VIEW -->
<div id="view" class="panel" style="display:none;">
  <div id="viewer">Wybierz event</div>
</div>

</div>

<script>

let events = JSON.parse(localStorage.getItem("events") || "[]");
let current = null;
let mode = "create";

function save(){
  localStorage.setItem("events", JSON.stringify(events));
  renderList();
}

function createEvent(){
  const e = {
    id: Date.now(),
    title: title.value,
    date: date.value,
    place: place.value,
    desc: desc.value
  };

  if(!e.title) return;

  events.push(e);
  save();

  title.value="";
  date.value="";
  place.value="";
  desc.value="";

  show('list');
}

function renderList(){
  const el = document.getElementById("events");
  el.innerHTML="";

  events.forEach(ev=>{
    const div = document.createElement("div");
    div.className="event";
    div.innerHTML = `<b>${ev.title}</b><br><small>${ev.date || ""}</small>`;

    div.onclick=()=>{
      current = ev;
      loadView(ev);
      show('view');
    };

    el.appendChild(div);
  });
}

function loadView(ev){

  const link = `${location.origin}${location.pathname}?id=${ev.id}`;

  document.getElementById("viewer").innerHTML = `
    <h2>${ev.title}</h2>
    <small>${ev.date || ""}</small><br>
    <small>${ev.place || ""}</small>

    <hr>

    <p>${ev.desc || ""}</p>

    <hr>

    <b>Share link:</b><br>
    <a href="${link}" target="_blank">${link}</a>

    <hr>

    <a href="https://wa.me/48700000000?text=Potwierdzam%20udział%20w%20${encodeURIComponent(ev.title)}">
      ✔ RSVP WhatsApp
    </a>
  `;
}

function show(tab){

  mode = tab;

  document.getElementById("create").style.display = tab==='create'?'block':'none';
  document.getElementById("list").style.display = tab==='list'?'block':'none';
  document.getElementById("view").style.display = tab==='view'?'block':'none';

  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));

  if(tab==='create') tabCreate.classList.add("active");
  if(tab==='list') tabList.classList.add("active");
  if(tab==='view') tabView.classList.add("active");
}

function loadFromURL(){
  const params = new URLSearchParams(location.search);
  const id = params.get("id");

  if(!id) return;

  const ev = events.find(e=>e.id == id);

  if(ev){
    current = ev;
    loadView(ev);
    show('view');
  }
}

renderList();
loadFromURL();

</script>

</body>
</html>
